<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>連續鏡頭掃描器 (BarcodeDetector 雙模版)</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; text-align: center; padding: 16px; }
    h2 { margin-bottom: 12px; color: #4CAF50; }
    .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 16px; }
    .badge-native { background: #2e7d32; color: #e8f5e9; }
    .badge-fallback { background: #ef6c00; color: #fff3e0; }
    #video-container { position: relative; width: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; border-radius: 12px; background: #000; aspect-ratio: 4/3; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .overlay-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 65%; height: 65%; border: 2px dashed #4CAF50; border-radius: 8px; pointer-events: none; }
    .btn { display: inline-block; margin: 12px 6px; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; background: #2196F3; color: white; }
    .btn-secondary { background: #424242; }
    #result-box { margin: 16px auto; max-width: 480px; padding: 12px; background: #1e1e1e; border-radius: 8px; border: 1px solid #333; text-align: left; word-break: break-all; min-height: 80px; }
    #fallback-section { display: none; margin-top: 16px; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <h2>即時連續掃描器</h2>
  <div id="mode-badge" class="status-badge">正在檢測硬體支援度...</div>

  <div id="video-container">
    <video id="video" playsinline></video>
    <div class="overlay-box"></div>
  </div>

  <div id="controls">
    <button class="btn" id="start-btn" onclick="startCamera()">開啟連續鏡頭</button>
    <button class="btn btn-secondary" onclick="stopCamera()">關閉鏡頭</button>
  </div>

  <div id="fallback-section">
    <p style="font-size: 14px; color: #aaa; margin-bottom: 8px;">當前瀏覽器不支援原生連續掃描，請改用拍照上傳：</p>
    <label for="file-input" class="btn">📷 拍照 / 選擇圖片辨識</label>
    <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(event)">
  </div>

  <div id="result-box">
    <strong>掃描結果：</strong>
    <p id="scan-result" style="color: #ffeb3b; margin-top: 8px;">等待掃描中...</p>
  </div>

  <canvas id="hidden-canvas" style="display: none;"></canvas>

  <script>
    let videoStream = null;
    let isScanning = false;
    let barcodeDetector = null;
    const video = document.getElementById('video');
    const resultElem = document.getElementById('scan-result');
    const modeBadge = document.getElementById('mode-badge');
    const fallbackSection = document.getElementById('fallback-section');

    // 1. 初始化檢查硬體支援
    async function initCheck() {
      if ('BarcodeDetector' in window) {
        try {
          const supportedFormats = await BarcodeDetector.getSupportedFormats();
          if (supportedFormats.includes('qr_code')) {
            barcodeDetector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'ean_13'] });
            modeBadge.textContent = "⚡ 已啟用：原生硬體加速 (高幀率連續掃描)";
            modeBadge.className = "status-badge badge-native";
            return;
          }
        } catch (e) { console.warn("BarcodeDetector 檢測失敗:", e); }
      }
      
      // 降級備用提示
      modeBadge.textContent = "⚠️ 已降級：通用相容模式 (建議拍照上傳)";
      modeBadge.className = "status-badge badge-fallback";
      fallbackSection.style.display = "block";
    }

    // 2. 開啟鏡頭
    async function startCamera() {
      if (isScanning) return;
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = videoStream;
        await video.play();
        isScanning = true;
        
        if (barcodeDetector) {
          requestAnimationFrame(scanWithNativeDetector);
        } else {
          scanWithFallbackJS();
        }
      } catch (err) {
        alert("無法存取相機，請確認權限設定。");
        console.error(err);
      }
    }

    // 3. 模式 A：原生 BarcodeDetector 連續掃描 (高效不卡頓)
    async function scanWithNativeDetector() {
      if (!isScanning) return;
      try {
        const barcodes = await barcodeDetector.detect(video);
        if (barcodes.length > 0) {
          resultElem.textContent = barcodes[0].rawValue;
        }
      } catch (err) { console.error(err); }
      if (isScanning) requestAnimationFrame(scanWithNativeDetector);
    }

    // 4. 模式 B：純 JS 降級降頻掃描 (避免發燙)
    function scanWithFallbackJS() {
      if (!isScanning) return;
      const canvas = document.getElementById('hidden-canvas');
      const ctx = canvas.getContext('2d');
      
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        
        if (code) {
          resultElem.textContent = code.data;
        }
      }
      // 設定每秒採樣 4 次 (250ms)，防止 CPU 過載
      if (isScanning) setTimeout(scanWithFallbackJS, 250);
    }

    // 5. 模式 C：檔案 / 拍照上傳解析
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('hidden-canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code) {
            resultElem.textContent = code.data;
          } else {
            alert("未能讀取到清晰的 QR Code，請試著重新拍照。");
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 6. 關閉鏡頭
    function stopCamera() {
      isScanning = false;
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
    }

    // 頁面載入時執行檢測
    window.onload = initCheck;
  </script>
</body>
</html>
