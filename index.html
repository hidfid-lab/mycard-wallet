<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyCard 儲值卡快掃助手</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #0f141c; 
      color: #e0e6ed; 
      text-align: center; 
      padding: 16px;
      padding-bottom: 40px;
    }
    
    header { margin-bottom: 16px; }
    h1 { font-size: 20px; color: #3b82f6; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .subtitle { font-size: 12px; color: #8899a6; }

    .status-badge { 
      display: inline-block; 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-size: 13px; 
      font-weight: bold; 
      margin: 12px 0; 
    }
    .badge-native { background: #166534; color: #4ade80; border: 1px solid #22c55e; }
    .badge-fallback { background: #9a3412; color: #ffedd5; border: 1px solid #f97316; }

    #video-container { 
      position: relative; 
      width: 100%; 
      max-width: 420px; 
      margin: 0 auto; 
      overflow: hidden; 
      border-radius: 16px; 
      background: #000; 
      aspect-ratio: 4/3; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid #1e293b;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* 掃描框與動態線條 */
    .overlay-box { 
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      width: 70%; 
      height: 60%; 
      border: 2px solid #3b82f6; 
      border-radius: 12px; 
      pointer-events: none; 
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.4);
    }
    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: #60a5fa;
      box-shadow: 0 0 8px #3b82f6;
      animation: scan 2s infinite ease-in-out;
    }
    @keyframes scan {
      0% { top: 5%; }
      50% { top: 95%; }
      100% { top: 5%; }
    }

    .btn-group { display: flex; justify-content: center; gap: 10px; margin: 16px auto; max-width: 420px; }
    .btn { 
      flex: 1;
      padding: 12px 16px; 
      font-size: 15px; 
      font-weight: bold; 
      border-radius: 10px; 
      border: none; 
      cursor: pointer; 
      background: #2563eb; 
      color: white; 
      transition: background 0.2s;
    }
    .btn:active { background: #1d4ed8; }
    .btn-secondary { background: #334155; color: #cbd5e1; }
    .btn-secondary:active { background: #1e293b; }

    /* 最新讀取結果區塊 */
    .result-card {
      margin: 16px auto; 
      max-width: 420px; 
      padding: 16px; 
      background: #1e293b; 
      border-radius: 12px; 
      border: 1px solid #334155; 
      text-align: left;
    }
    .result-header { font-size: 13px; color: #94a3b8; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .result-content { 
      font-size: 18px; 
      font-family: monospace; 
      font-weight: bold; 
      color: #facc15; 
      word-break: break-all;
      margin-bottom: 12px;
    }
    .action-row { display: flex; gap: 8px; }
    .btn-sm { padding: 8px 12px; font-size: 13px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
    .btn-copy { background: #059669; color: white; }
    .btn-link { background: #0284c7; color: white; text-decoration: none; display: inline-block; text-align: center; }

    #fallback-section { display: none; margin: 12px auto; max-width: 420px; }
    input[type="file"] { display: none; }

    /* 歷史記錄清單 */
    .history-section { margin: 24px auto 0; max-width: 420px; text-align: left; }
    .history-title { font-size: 14px; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .history-list { list-style: none; max-height: 200px; overflow-y: auto; }
    .history-item { 
      background: #0f172a; 
      padding: 10px 12px; 
      border-radius: 8px; 
      margin-bottom: 6px; 
      font-family: monospace; 
      font-size: 14px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      border: 1px solid #1e293b;
    }
    .clear-btn { background: none; border: none; color: #ef4444; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>💳 MyCard 條碼/QR快掃助手</h1>
    <div class="subtitle">針對 MyCard 點數卡優化之連續鏡頭辨識工具</div>
  </header>

  <div id="mode-badge" class="status-badge">正在檢測硬體支援度...</div>

  <div id="video-container">
    <video id="video" playsinline></video>
    <div class="overlay-box">
      <div class="scan-line"></div>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" id="start-btn" onclick="startCamera()">開啟連續鏡頭</button>
    <button class="btn btn-secondary" onclick="stopCamera()">關閉鏡頭</button>
  </div>

  <div id="fallback-section">
    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 8px;">當前瀏覽器不支援原生高幀率掃描，建議拍照上傳：</p>
    <label for="file-input" class="btn btn-secondary" style="display: block; width: 100%;">📷 拍照 / 選擇圖片辨識</label>
    <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(event)">
  </div>

  <div class="result-card">
    <div class="result-header">
      <span>最新掃描結果</span>
      <span id="scan-time"></span>
    </div>
    <div class="result-content" id="scan-result">等待掃描中...</div>
    <div class="action-row" id="action-buttons" style="display: none;">
      <button class="btn-sm btn-copy" onclick="copyResult()">複製內容</button>
      <a class="btn-sm btn-link" href="https://www.mycard520.com.tw/MyCardPay/" target="_blank">前往 MyCard 儲值</a>
    </div>
  </div>

  <div class="history-section">
    <div class="history-title">
      <span>掃描歷史紀錄 (<span id="history-count">0</span>)</span>
      <button class="clear-btn" onclick="clearHistory()">清除紀錄</button>
    </div>
    <ul class="history-list" id="history-list"></ul>
  </div>

  <canvas id="hidden-canvas" style="display: none;"></canvas>

  <script>
    let videoStream = null;
    let isScanning = false;
    let barcodeDetector = null;
    let lastScannedText = "";
    let lastScannedTime = 0;
    const historyData = [];

    const video = document.getElementById('video');
    const resultElem = document.getElementById('scan-result');
    const modeBadge = document.getElementById('mode-badge');
    const fallbackSection = document.getElementById('fallback-section');
    const actionButtons = document.getElementById('action-buttons');
    const scanTimeElem = document.getElementById('scan-time');

    // 1. 初始化檢查硬體支援 (支援 QR Code 與常用一維條碼)
    async function initCheck() {
      if ('BarcodeDetector' in window) {
        try {
          const supportedFormats = await BarcodeDetector.getSupportedFormats();
          if (supportedFormats.includes('qr_code')) {
            barcodeDetector = new BarcodeDetector({ 
              formats: ['qr_code', 'code_128', 'code_39', 'ean_13'] 
            });
            modeBadge.textContent = "⚡ 已啟用：原生硬體加速 (高幀率連續掃描)";
            modeBadge.className = "status-badge badge-native";
            return;
          }
        } catch (e) { console.warn("BarcodeDetector 檢測失敗:", e); }
      }
      
      // 降級備用提示
      modeBadge.textContent = "⚠️ 已降級：通用相容模式 (建議拍照上傳)";
      modeBadge.className = "status-badge badge-fallback";
      fallbackSection.style.display = "block";
    }

    // 2. 開啟鏡頭
    async function startCamera() {
      if (isScanning) return;
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = videoStream;
        await video.play();
        isScanning = true;
        
        if (barcodeDetector) {
          requestAnimationFrame(scanWithNativeDetector);
        } else {
          scanWithFallbackJS();
        }
      } catch (err) {
        alert("無法存取相機，請確認已授權相機存取權限。");
        console.error(err);
      }
    }

    // 處理成功掃描後的資料
    function handleScanSuccess(dataText) {
      const now = Date.now();
      // 防止冷卻時間內重複觸發 (2秒冷卻)
      if (dataText === lastScannedText && (now - lastScannedTime) < 2000) {
        return;
      }

      lastScannedText = dataText;
      lastScannedTime = now;

      // 觸發手機震動反饋
      if (navigator.vibrate) {
        navigator.vibrate(100);
      }

      resultElem.textContent = dataText;
      scanTimeElem.textContent = new Date().toLocaleTimeString();
      actionButtons.style.display = "flex";

      // 加入歷史紀錄
      if (!historyData.includes(dataText)) {
        historyData.unshift(dataText);
        updateHistoryUI();
      }
    }

    // 3. 模式 A：原生 BarcodeDetector 連續掃描
    async function scanWithNativeDetector() {
      if (!isScanning) return;
      try {
        const barcodes = await barcodeDetector.detect(video);
        if (barcodes.length > 0) {
          handleScanSuccess(barcodes[0].rawValue);
        }
      } catch (err) { console.error(err); }
      if (isScanning) requestAnimationFrame(scanWithNativeDetector);
    }

    // 4. 模式 B：純 JS 降級降頻掃描
    function scanWithFallbackJS() {
      if (!isScanning) return;
      const canvas = document.getElementById('hidden-canvas');
      const ctx = canvas.getContext('2d');
      
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        
        if (code) {
          handleScanSuccess(code.data);
        }
      }
      if (isScanning) setTimeout(scanWithFallbackJS, 250);
    }

    // 5. 模式 C：檔案 / 拍照上傳解析
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('hidden-canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code) {
            handleScanSuccess(code.data);
          } else {
            alert("未能讀取到清晰的條碼或 QR Code，請重試。");
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 6. 關閉鏡頭
    function stopCamera() {
      isScanning = false;
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
    }

    // 複製結果到剪貼簿
    function copyResult() {
      if (!lastScannedText) return;
      navigator.clipboard.writeText(lastScannedText).then(() => {
        alert("已複製序號/卡號至剪貼簿！");
      }).catch(err => {
        alert("複製失敗，請手動複製。");
      });
    }

    // 更新歷史紀錄 UI
    function updateHistoryUI() {
      const historyList = document.getElementById('history-list');
      const historyCount = document.getElementById('history-count');
      historyList.innerHTML = '';
      historyCount.textContent = historyData.length;

      historyData.forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <span>${item}</span>
          <button class="btn-sm btn-copy" onclick="navigator.clipboard.writeText('${item}')">複製</button>
        `;
        historyList.appendChild(li);
      });
    }

    // 清除歷史紀錄
    function clearHistory() {
      historyData.length = 0;
      updateHistoryUI();
    }

    window.onload = initCheck;
  </script>
</body>
</html>
