<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快樂小七 - QR Code 掃描版</title>
    <!-- 引入 HTML5 QR Code 官方套件 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .happy-711-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #008837;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #008837;
            margin: 0;
            font-size: 24px;
        }

        /* 鏡頭掃描區域 */
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        /* 掃描結果顯示區 */
        .result-panel {
            margin-top: 20px;
            padding: 15px;
            background: #eef9f2;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
        }

        .result-title {
            font-weight: bold;
            color: #155724;
            margin-bottom: 5px;
        }

        .scan-history {
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            padding: 8px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="happy-711-container">
    <div class="header">
        <h1>快樂小七掃描系統</h1>
    </div>

    <!-- 鏡頭渲染區塊（一定要保留這個 ID） -->
    <div id="reader"></div>

    <div class="result-panel">
        <div class="result-title">最新掃描結果：</div>
        <div id="scanned-result" style="font-size: 18px; word-break: break-all;">等待掃描中...</div>
    </div>

    <div class="scan-history">
        <div class="result-title">已讀取記錄：</div>
        <div id="history-list"></div>
    </div>
</div>

<script>
    // Web Audio API 音效生成器（免外部音訊檔，確保瀏覽器相容性）
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // 播放成功音效 (高音嗶)
    function playSuccessSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1000, audioCtx.currentTime); // 1000Hz
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15); // 播放 0.15 秒
    }

    // 播放重複/警告音效 (雙低音逼逼)
    function playDuplicateSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime); // 300Hz
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        // 嗶嗶兩聲的效果
        setTimeout(() => osc.frequency.setValueAtTime(200, audioCtx.currentTime), 100);
        osc.stop(audioCtx.currentTime + 0.3);
    }

    // 記錄已掃描過的條碼與防抖機制
    const scannedSet = new Set();
    let lastScannedCode = "";
    let lastScanTime = 0;

    function onScanSuccess(decodedText, decodedResult) {
        const currentTime = Date.now();

        // 防止同一個 Code 在 1.5 秒內被連續多次誤觸發
        if (decodedText === lastScannedCode && (currentTime - lastScanTime) < 1500) {
            return;
        }

        lastScannedCode = decodedText;
        lastScanTime = currentTime;

        const resultElement = document.getElementById('scanned-result');
        const historyElement = document.getElementById('history-list');

        if (scannedSet.has(decodedText)) {
            // 重複掃描處理
            playDuplicateSound();
            resultElement.innerText = "【重複】" + decodedText;
            resultElement.style.color = "#d9534f";
        } else {
            // 成功掃描處理
            scannedSet.add(decodedText);
            playSuccessSound();
            resultElement.innerText = decodedText;
            resultElement.style.color = "#28a745";

            // 寫入歷史紀錄
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerText = `${new Date().toLocaleTimeString()} - ${decodedText}`;
            historyElement.prepend(item);
        }
    }

    function onScanFailure(error) {
        // 持續掃描過程中未識別到 QR Code 時的靜默處理
    }

    // 當 DOM 載入 completed 後再初始化鏡頭，確保 Happy 7-11 架構完全存在
    document.addEventListener("DOMContentLoaded", function () {
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    });
</script>

</body>
</html>
