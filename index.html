<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快樂小七 - 錢包與條碼管理系統</title>
    <!-- 引入條碼掃描套件 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #333; padding-bottom: 30px; }
        
        .header { background: #1c1c1e; color: #fff; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }

        /* 通用卡片與區塊風格 */
        .section-card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; border-bottom: 2px solid #007aff; padding-bottom: 4px; display: inline-block; }

        /* 表單控制項 */
        label { display: block; font-size: 14px; margin-top: 10px; margin-bottom: 4px; font-weight: 500; }
        select, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; }
        
        /* 雙鏡頭掃描區域 */
        .scanner-container { display: flex; gap: 10px; margin-top: 15px; }
        .camera-box { flex: 1; background: #2c2c2e; border-radius: 8px; padding: 8px; text-align: center; color: #fff; min-height: 180px; display: flex; flex-direction: column; justify-content: space-between; }
        .camera-title { font-size: 13px; margin-bottom: 6px; font-weight: bold; color: #0a84ff; }
        .viewport { width: 100%; height: 120px; background: #000; border-radius: 6px; overflow: hidden; position: relative; }

        /* 按鈕風格 */
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 12px; transition: background 0.2s; }
        .btn-primary { background: #007aff; color: #fff; }
        .btn-success { background: #34c759; color: #fff; }
        .btn-warning { background: #ff9500; color: #fff; }

        /* 卡片清單與封存區 */
        .wallet-card { background: #fff; border: 1px solid #e5e5ea; border-radius: 10px; padding: 12px; margin-bottom: 10px; position: relative; }
        .wallet-card.used { background: #f2f2f7; opacity: 0.6; }
        .card-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; background: #e5f1ff; color: #007aff; font-weight: 500; }
        .card-amount { font-size: 18px; font-weight: bold; color: #ff3b30; margin: 6px 0; }
        
        /* MyCard 強制警示文字 */
        .mycard-warning { margin-top: 8px; padding: 8px; background-color: #fff0f0; border-radius: 6px; border: 1px solid #ffcccb; color: #ff0000; font-size: 12px; font-weight: bold; text-align: center; line-line: 1.4; }

        /* 日誌紀錄 */
        .log-item { font-size: 13px; color: #666; padding: 4px 0; border-bottom: 1px dashed #eee; }
    </style>
</head>
<body>

    <div class="header">快樂小七 - 雙鏡頭與錢包管理</div>

    <div class="container">
        
        <!-- 1. 掃描與建立區塊 -->
        <div class="section-card">
            <div class="section-title">新增卡片 / 點數卡</div>
            
            <!-- 選擇通路與卡別 -->
            <label for="channelSelect">選擇通路與卡別</label>
            <select id="channelSelect" onchange="handleChannelChange()">
                <option value="7-11">7-ELEVEN 商品卡/隨取卡</option>
                <option value="FamilyMart">全家便利商店</option>
                <option value="MyCard">MyCard / 遊戲點數</option>
                <option value="CUSTOM">＋ 新增自訂通路...</option>
            </select>
            
            <div id="customChannelBox" style="display: none; margin-top: 8px;">
                <input type="text" id="customChannelInput" placeholder="請輸入自訂通路名稱">
            </div>

            <!-- 面額選擇 -->
            <label for="denominationSelect">選擇本次掃描面額</label>
            <select id="denominationSelect" onchange="handleDenominationChange()">
                <option value="100">100 元 / 點</option>
                <option value="200">200 元 / 點</option>
                <option value="500">500 元 / 點</option>
                <option value="1000">1000 元 / 點</option>
                <option value="CUSTOM_AMOUNT">自訂面額...</option>
            </select>
            <div id="customAmountBox" style="display: none; margin-top: 8px;">
                <input type="number" id="customAmountInput" placeholder="請輸入自訂面額金額">
            </div>

            <!-- 獨立雙鏡頭掃描區域 -->
            <div class="scanner-container">
                <!-- 鏡頭 A -->
                <div class="camera-box">
                    <div class="camera-title" id="camATitle">主條碼 (鏡頭 A)</div>
                    <div class="viewport" id="readerA"></div>
                    <input type="text" id="codeA" placeholder="掃描結果 A" style="margin-top: 5px; font-size: 12px;">
                </div>
                <!-- 鏡頭 B -->
                <div class="camera-box">
                    <div class="camera-title" id="camBTitle">副條碼 (鏡頭 B)</div>
                    <div class="viewport" id="readerB"></div>
                    <input type="text" id="codeB" placeholder="掃描結果 B" style="margin-top: 5px; font-size: 12px;">
                </div>
            </div>

            <button class="btn btn-primary" onclick="addCardToWallet()">儲存卡片至錢包</button>
        </div>

        <!-- 2. 錢包湊款演算法計算區 -->
        <div class="section-card">
            <div class="section-title">錢包湊款試算</div>
            <label>輸入目標消費金額</label>
            <input type="number" id="targetAmount" placeholder="例如：250">
            <button class="btn btn-warning" onclick="calculateCombination()">計算最佳湊款組合</button>
            <div id="calcResult" style="margin-top: 10px; font-weight: bold; color: #007aff;"></div>
        </div>

        <!-- 3. 卡片錢包清單（包含 MyCard 狀態管理） -->
        <div class="section-card">
            <div class="section-title">錢包卡片清單</div>
            <div id="walletList"></div>
        </div>

        <!-- 4. 已使用/封存管理區 -->
        <div class="section-card">
            <div class="section-title">已封存/已使用卡片</div>
            <div id="archivedList"></div>
        </div>

        <!-- 5. 工作日誌 -->
        <div class="section-card">
            <div class="section-title">工作日誌</div>
            <div id="logList"></div>
        </div>

    </div>

    <script>
        // 核心資料庫 state
        let wallet = [];
        let logs = [];

        // 初始化
        window.onload = function() {
            addLog("系統初始化完成，雙鏡頭模組與 MyCard 架構已載入。");
            initCameras();
        };

        // 工作日誌
        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            logs.unshift(`[${time}] ${msg}`);
            renderLogs();
        }

        function renderLogs() {
            const container = document.getElementById('logList');
            container.innerHTML = logs.slice(0, 5).map(l => `<div class="log-item">${l}</div>`).join('');
        }

        // 1. 切換通路與介面調整
        function handleChannelChange() {
            const channel = document.getElementById('channelSelect').value;
            const customBox = document.getElementById('customChannelBox');
            const camATitle = document.getElementById('camATitle');
            const camBTitle = document.getElementById('camBTitle');
            const denomSelect = document.getElementById('denominationSelect');

            // 自訂通路顯示處理
            if (channel === 'CUSTOM') {
                customBox.style.display = 'block';
            } else {
                customBox.style.display = 'none';
            }

            // 針對 MyCard 調整獨立雙鏡頭視詞與預設面額
            if (channel === 'MyCard') {
                camATitle.innerText = "卡號 (鏡頭 A)";
                camBTitle.innerText = "密碼 (鏡頭 B)";
                denomSelect.value = "100"; // 預設 100
                addLog("切換至 MyCard 模式：鏡頭結構調整為 [卡號 / 密碼]");
            } else {
                camATitle.innerText = "主條碼 (鏡頭 A)";
                camBTitle.innerText = "副條碼 (鏡頭 B)";
            }
        }

        // 面額變更處理
        function handleDenominationChange() {
            const val = document.getElementById('denominationSelect').value;
            const customBox = document.getElementById('customAmountBox');
            if (val === 'CUSTOM_AMOUNT') {
                customBox.style.display = 'block';
            } else {
                customBox.style.display = 'none';
            }
        }

        // 2. 獨立雙鏡頭掃描器啟動 (Mock / 介面結構範例)
        function initCameras() {
            // 此處示範結合 html5-qrcode 獨立掛載兩套掃描視圖
            try {
                const html5QrCodeA = new Html5Qrcode("readerA");
                const html5QrCodeB = new Html5Qrcode("readerB");
                // 電腦或手機若無多鏡頭可獨立開啟UI介面，掃描邏輯依環境綁定
            } catch(e) {
                console.log("雙鏡頭初始化提示：目前環境採用輸入框模擬，條碼元件已佈署。");
            }
        }

        // 3. 儲存卡片至錢包
        function addCardToWallet() {
            let channel = document.getElementById('channelSelect').value;
            if (channel === 'CUSTOM') {
                channel = document.getElementById('customChannelInput').value || '自訂通路';
            }

            let amountVal = document.getElementById('denominationSelect').value;
            if (amountVal === 'CUSTOM_AMOUNT') {
                amountVal = document.getElementById('customAmountInput').value;
            }
            const amount = Number(amountVal) || 100;

            const codeA = document.getElementById('codeA').value || 'MC-' + Math.floor(Math.random()*899999+100000);
            const codeB = document.getElementById('codeB').value || 'PWD-' + Math.floor(Math.random()*899999+100000);

            const card = {
                id: Date.now(),
                channel: channel,
                amount: amount,
                codeA: codeA,
                codeB: codeB,
                isMyCard: (channel === 'MyCard'),
                isUsed: false
            };

            wallet.push(card);
            addLog(`新增卡片成功：[${channel}] 面額 $${amount}`);
            
            // 清空輸入
            document.getElementById('codeA').value = '';
            document.getElementById('codeB').value = '';

            renderWallet();
        }

        // 4. 渲染錢包與封存清單
        function renderWallet() {
            const walletList = document.getElementById('walletList');
            const archivedList = document.getElementById('archivedList');

            walletList.innerHTML = '';
            archivedList.innerHTML = '';

            wallet.forEach(card => {
                const isMyCard = card.isMyCard;
                
                // MyCard 強制附帶紅色警示
                const warningHtml = isMyCard ? `
                    <div class="mycard-warning">
                        會員點數限儲值至my car會員帳號，請點選App下方「儲值購買」後，掃描QR Code
                    </div>
                ` : '';

                const cardHtml = `
                    <div class="wallet-card ${card.isUsed ? 'used' : ''}">
                        <span class="card-tag">${card.channel}</span>
                        <div class="card-amount">$${card.amount}</div>
                        <div style="font-size: 12px; color: #555;">
                            ${isMyCard ? '卡號' : '主條碼'}: ${card.codeA}<br>
                            ${isMyCard ? '密碼' : '副條碼'}: ${card.codeB}
                        </div>
                        ${warningHtml}
                        <button class="btn ${card.isUsed ? 'btn-primary' : 'btn-success'}" style="padding: 6px; font-size: 12px; margin-top: 8px;" onclick="toggleCardStatus(${card.id})">
                            ${card.isUsed ? '重新啟用 (移出封存)' : '標記為已使用 (封存)'}
                        </button>
                    </div>
                `;

                if (card.isUsed) {
                    archivedList.innerHTML += cardHtml;
                } else {
                    walletList.innerHTML += cardHtml;
                }
            });
        }

        // 5. 狀態管理：切換使用/封存狀態
        function toggleCardStatus(id) {
            const card = wallet.find(c => c.id === id);
            if (card) {
                card.isUsed = !card.isUsed;
                addLog(`卡片狀態變更：[${card.channel}] $${card.amount} -> ${card.isUsed ? '封存' : '啟用'}`);
                renderWallet();
            }
        }

        // 6. 湊款演算法 (貪婪與組合搜尋)
        function calculateCombination() {
            const target = Number(document.getElementById('targetAmount').value);
            if (!target) {
                alert("請輸入目標金額");
                return;
            }

            // 過濾未使用的卡片
            const activeCards = wallet.filter(c => !c.isUsed);
            
            // 尋找剛好大於等於目標金額的最佳組合
            let bestCombo = [];
            let minDiff = Infinity;

            // 簡單子集組合試算
            const n = activeCards.length;
            for (let i = 1; i < (1 << n); i++) {
                let sum = 0;
                let combo = [];
                for (let j = 0; j < n; j++) {
                    if ((i >> j) & 1) {
                        sum += activeCards[j].amount;
                        combo.push(activeCards[j]);
                    }
                }
                if (sum >= target && (sum - target) < minDiff) {
                    minDiff = sum - target;
                    bestCombo = combo;
                }
            }

            const resultDiv = document.getElementById('calcResult');
            if (bestCombo.length > 0) {
                const comboNames = bestCombo.map(c => `${c.channel}($${c.amount})`).join(' + ');
                const total = bestCombo.reduce((s, c) => s + c.amount, 0);
                resultDiv.innerHTML = `推薦湊款組合：${comboNames}<br>總面額：$${total} (找零/剩餘：$${total - target})`;
                addLog(`完成湊款試算：目標 $${target}，使用組合 $${total}`);
            } else {
                resultDiv.innerHTML = "現有未使用卡片金額不足以支付目標金額。";
            }
        }
    </script>
</body>
</html>
