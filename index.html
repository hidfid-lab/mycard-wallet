<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快樂小七收銀台 (多超商 + MyCard 獨立雙鏡頭版)</title>
  
  <!-- 超商原本使用的掃描套件與 QR 生成工具 -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- MyCard 專用降級解析核心 -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #0d1117; 
      color: #e6edf3; 
      text-align: center; 
      padding: 16px; 
      padding-bottom: 60px;
    }

    header { margin-bottom: 16px; }
    h1 { font-size: 20px; color: #38bdf8; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #8b949e; }

    /* 資料夾選單 (新增 MyCard) */
    .folder-tab-group {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 16px auto;
      max-width: 420px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .folder-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .folder-btn.active {
      background: #0284c7;
      color: white;
      border-color: #38bdf8;
    }

    /* 1. 原本快樂小七超商專用鏡頭容器 */
    #cvs-reader-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 1px solid #30363d;
      display: block;
    }
    #reader { width: 100%; min-height: 250px; }

    /* 2. MyCard 專屬原生鏡頭容器 */
    #mycard-video-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 4/3;
      border: 1px solid #00aeef;
      box-shadow: 0 0 15px rgba(0, 174, 239, 0.2);
      display: none; /* 預設隱藏 */
    }
    #mycard-video { width: 100%; height: 100%; object-fit: cover; }
    .overlay-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 70%; height: 60%; border: 2px solid #00aeef; border-radius: 12px;
      pointer-events: none; box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.4);
    }
    .scan-line {
      position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: #38bdf8; box-shadow: 0 0 8px #0284c7;
      animation: scan 2s infinite ease-in-out;
    }
    @keyframes scan { 0% { top: 5%; } 50% { top: 95%; } 100% { top: 5%; } }

    /* 控制按鈕組 */
    .btn-group { display: flex; justify-content: center; gap: 10px; margin: 16px auto; max-width: 420px; }
    .btn {
      flex: 1; padding: 12px; font-size: 14px; font-weight: bold;
      border-radius: 10px; border: none; cursor: pointer; background: #0284c7; color: white;
    }
    .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }

    /* 擬真結果展示區 */
    .card-container {
      margin: 20px auto; max-width: 420px;
      background: #161b22; border: 1px solid #30363d; border-radius: 16px;
      padding: 16px; text-align: left; display: none;
    }
    .card-container.mycard-style {
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
      border: 2px solid #00aeef;
    }
    .info-label { font-size: 11px; color: #8b949e; }
    .info-value { font-size: 15px; font-family: monospace; font-weight: bold; color: #f3f4f6; margin-bottom: 8px; word-break: break-all; }
    .card-flex { display: flex; justify-content: space-between; align-items: center; }
    .card-qr-box { background: white; padding: 6px; border-radius: 6px; }

    .btn-archive { width: 100%; background: #059669; color: white; padding: 10px; border-radius: 8px; border: none; font-weight: bold; margin-top: 12px; cursor: pointer; }

    /* 工作日誌區塊 */
    .history-section { margin: 24px auto 0; max-width: 420px; text-align: left; }
    .history-title { font-size: 14px; color: #8b949e; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .history-list { list-style: none; max-height: 250px; overflow-y: auto; }
    .history-item { background: #161b22; padding: 10px; border-radius: 8px; margin-bottom: 6px; border: 1px solid #30363d; font-size: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>🏪 快樂小七萬能收銀台</h1>
    <div class="subtitle" id="current-folder-desc">當前目錄：統一超商 (7-ELEVEN)</div>
  </header>

  <!-- 資料夾切換 Tab -->
  <div class="folder-tab-group">
    <button class="folder-btn active" onclick="switchFolder('711')">7-ELEVEN</button>
    <button class="folder-btn" onclick="switchFolder('familymart')">全家</button>
    <button class="folder-btn" onclick="switchFolder('hilife')">萊爾富</button>
    <button class="folder-btn" onclick="switchFolder('ok')">OK超商</button>
    <button class="folder-btn" style="border-color: #00aeef; color: #38bdf8;" onclick="switchFolder('mycard')">💳 MyCard</button>
  </div>

  <!-- 1. 原本快樂小七超商雙條碼鏡頭容器 -->
  <div id="cvs-reader-container">
    <div id="reader"></div>
  </div>

  <!-- 2. 新增 MyCard 專屬原生鏡頭容器 -->
  <div id="mycard-video-container">
    <video id="mycard-video" playsinline></video>
    <div class="overlay-box">
      <div class="scan-line"></div>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" onclick="startCurrentCamera()">開啟鏡頭</button>
    <button class="btn btn-secondary" onclick="stopAllCameras()">關閉鏡頭</button>
  </div>

  <!-- 擬真卡片/掃描結果展示 -->
  <div id="card-display" class="card-container">
    <div class="card-flex">
      <div>
        <div class="info-label" id="res-type-label">卡號 / 條碼資訊</div>
        <div id="res-card-no" class="info-value">----</div>
        <div class="info-label" id="res-pwd-label">密碼 / 補充數據</div>
        <div id="res-card-pwd" class="info-value">----</div>
      </div>
      <div class="card-qr-box">
        <div id="qrcode"></div>
      </div>
    </div>
    <button class="btn-archive" onclick="archiveToLog()">📥 封存至工作日誌</button>
  </div>

  <!-- 工作日誌區 */ -->
  <div class="history-section">
    <div class="history-title">
      <span>工作日誌紀錄</span>
      <button style="background:none; border:none; color:#f85149; cursor:pointer;" onclick="clearLog()">清空日誌</button>
    </div>
    <ul class="history-list" id="worklog-list"></ul>
  </div>

  <canvas id="hidden-canvas" style="display: none;"></canvas>

  <script>
    let currentFolder = '711';
    
    // 超商原版 Html5Qrcode 實例
    let cvsScanner = null;
    
    // MyCard 原生鏡頭變數
    let mycardStream = null;
    let isMyCardScanning = false;
    let barcodeDetector = null;
    
    let lastResultData = null;
    const STORAGE_KEY = 'happy7_worklog';

    window.onload = () => {
      renderLog();
      initMyCardDetector();
    };

    // 切換資料夾選單
    function switchFolder(folder) {
      stopAllCameras();
      currentFolder = folder;

      document.querySelectorAll('.folder-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const descMap = {
        '711': '當前目錄：統一超商 (7-ELEVEN)',
        'familymart': '當前目錄：全家便利商店',
        'hilife': '當前目錄：萊爾富 Hi-Life',
        'ok': '當前目錄：OK超商',
        'mycard': '當前目錄：MyCard 點數卡專區'
      };
      document.getElementById('current-folder-desc').textContent = descMap[folder];

      const cvsContainer = document.getElementById('cvs-reader-container');
      const mycardContainer = document.getElementById('mycard-video-container');

      if (folder === 'mycard') {
        cvsContainer.style.display = 'none';
        mycardContainer.style.display = 'block';
      } else {
        cvsContainer.style.display = 'block';
        mycardContainer.style.display = 'none';
      }
    }

    // 動態鏡頭路由啟動
    function startCurrentCamera() {
      stopAllCameras();
      if (currentFolder === 'mycard') {
        startMyCardCamera();
      } else {
        startCvsCamera();
      }
    }

    // 1. 原本超商的鏡頭啟動邏輯
    function startCvsCamera() {
      if (!cvsScanner) {
        cvsScanner = new Html5Qrcode("reader");
      }
      cvsScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        (decodedText) => {
          handleScanResult(decodedText, '超商條碼');
        },
        (errorMessage) => {}
      ).catch(err => alert("超商鏡頭啟動失敗: " + err));
    }

    // 2. MyCard 專屬原生鏡頭邏輯
    async function initMyCardDetector() {
      if ('BarcodeDetector' in window) {
        try {
          barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
        } catch (e) {}
      }
    }

    async function startMyCardCamera() {
      const video = document.getElementById('mycard-video');
      try {
        mycardStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = mycardStream;
        await video.play();
        isMyCardScanning = true;

        if (barcodeDetector) {
          requestAnimationFrame(scanMyCardNative);
        } else {
          scanMyCardFallback();
        }
      } catch (err) {
        alert("MyCard 鏡頭啟動失敗: " + err);
      }
    }

    async function scanMyCardNative() {
      if (!isMyCardScanning) return;
      const video = document.getElementById('mycard-video');
      try {
        const barcodes = await barcodeDetector.detect(video);
        if (barcodes.length > 0) {
          handleScanResult(barcodes[0].rawValue, 'MyCard');
          stopAllCameras();
          return;
        }
      } catch (err) {}
      if (isMyCardScanning) requestAnimationFrame(scanMyCardNative);
    }

    function scanMyCardFallback() {
      if (!isMyCardScanning) return;
      const video = document.getElementById('mycard-video');
      const canvas = document.getElementById('hidden-canvas');
      const ctx = canvas.getContext('2d');
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "attemptBoth" });
        if (code) {
          handleScanResult(code.data, 'MyCard');
          stopAllCameras();
          return;
        }
      }
      if (isMyCardScanning) setTimeout(scanMyCardFallback, 250);
    }

    // 關閉所有鏡頭
    function stopAllCameras() {
      if (cvsScanner && cvsScanner.isScanning) {
        cvsScanner.stop().catch(err => console.log(err));
      }
      isMyCardScanning = false;
      if (mycardStream) {
        mycardStream.getTracks().forEach(t => t.stop());
        mycardStream = null;
      }
    }

    // 統一處理掃描成功結果
    function handleScanResult(rawData, type) {
      if (navigator.vibrate) navigator.vibrate(100);

      const cardDisplay = document.getElementById('card-display');
      const cardNoElem = document.getElementById('res-card-no');
      const cardPwdElem = document.getElementById('res-card-pwd');

      let cardNo = "----", cardPwd = "----";

      if (type === 'MyCard') {
        cardDisplay.classList.add('mycard-style');
        if (rawData.includes('|')) {
          const parts = rawData.split('|').map(p => p.trim());
          if (parts.length >= 3) { cardNo = parts[1]; cardPwd = parts[2]; }
          else if (parts.length === 2) { cardNo = parts[0]; cardPwd = parts[1]; }
        } else {
          cardNo = rawData; cardPwd = "N/A";
        }
      } else {
        cardDisplay.classList.remove('mycard-style');
        cardNo = rawData;
        cardPwd = "條碼掃描完成";
      }

      cardNoElem.textContent = cardNo;
      cardPwdElem.textContent = cardPwd;
      cardDisplay.style.display = 'block';

      // 渲染 QR Code
      const qrBox = document.getElementById('qrcode');
      qrBox.innerHTML = '';
      new QRCode(qrBox, { text: rawData, width: 80, height: 80 });

      lastResultData = {
        folder: currentFolder,
        cardNo,
        cardPwd,
        raw: rawData,
        time: new Date().toLocaleString('zh-TW', { hour12: false })
      };
    }

    // 日誌封存
    function archiveToLog() {
      if (!lastResultData) return;
      let logs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      logs.unshift(lastResultData);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
      renderLog();
      alert("已成功封存至工作日誌！");
      document.getElementById('card-display').style.display = 'none';
      lastResultData = null;
    }

    function renderLog() {
      const list = document.getElementById('worklog-list');
      let logs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      list.innerHTML = '';
      logs.forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <div style="display:flex; justify-content:space-between; color:#8b949e;">
            <span>[${item.folder.toUpperCase()}] ${item.time}</span>
          </div>
          <div style="color:#38bdf8; font-weight:bold; margin-top:2px;">卡號/條碼: ${item.cardNo}</div>
          <div style="color:#c9d1d9;">密碼/詳情: ${item.cardPwd}</div>
        `;
        list.appendChild(li);
      });
    }

    function clearLog() {
      if (confirm("確定清空工作日誌？")) {
        localStorage.removeItem(STORAGE_KEY);
        renderLog();
      }
    }
  </script>
</body>
</html>
